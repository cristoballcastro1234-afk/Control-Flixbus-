<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Librería para convertir la página a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Salidas - FlixBus</title>
    <style>
        :root {
            --flix-green: #73d100;
            --flix-orange: #ff5f00;
            --dark: #222;
            --light: #f4f4f4;
            --flix-red: #ff4d4d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        header {
            background-color: var(--dark);
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            border-bottom: 5px solid var(--flix-green);
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .destino-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 4px solid var(--flix-orange);
        }
        .destino-header {
            background-color: #333;
            color: white;
            padding: 12px;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
            text-transform: uppercase;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }
        th {
            background-color: #eee;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        tr.despachado {
            background-color: #e2f0d9 !important;
            color: #385723;
        }
        tr.cancelado {
            background-color: #fce4d6 !important;
            color: #c00000;
        }
        tr.cancelado input {
            color: #c00000;
            font-weight: bold;
        }
        input[type="text"] {
            width: 75px;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .input-hora {
            width: 100px !important;
        }
        .fecha-actual {
            margin-top: 6px;
            font-size: 14px;
            font-weight: normal;
            color: #ddd;
        }
        .btn-cancelar {
            background-color: #777;
            border: none;
            color: white;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            margin-left: 3px;
        }
        .btn-cancelar:hover {
            background-color: var(--flix-red);
        }
        /* Botón de exportación PDF */
        .btn-pdf {
            background-color: var(--flix-green);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-pdf:hover {
            background-color: #61b300;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<header>
    <h1>REGISTRO EN TIEMPO REAL - FLIXBUS</h1>
    <div id="fecha-actual" class="fecha-actual">jueves 23 de julio de 2026</div>
    <button class="btn-pdf" onclick="descargarPDF()">📄 Descargar Reporte en PDF</button>
</header>

<div class="container" id="contenido-a-imprimir">

    <!-- DESTINO SANTIAGO -->
    <div class="destino-card">
        <div class="destino-header">Destino: Santiago</div>
        <table>
            <thead>
                <tr>
                    <th>Hora Plan</th>
                    <th>N° de Bus</th>
                    <th>Hora Real Salida</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    const horasSantiago = ["5:45", "6:00", "6:15", "6:45", "6:50", "7:15", "7:45", "7:50", "8:15", "8:30", "8:45", "9:00", "9:15", "9:45", "10:05", "10:25", "10:45", "10:55", "11:15", "11:45", "12:15", "12:25", "12:45", "13:15", "13:45", "14:00", "14:25", "14:45", "15:00", "15:15", "15:45", "16:00", "16:25", "16:30", "17:45", "18:00", "18:15", "18:25", "18:45", "19:00", "19:15", "19:30", "19:45", "20:00", "20:30", "21:00", "21:30"];
                    horasSantiago.forEach((hora, index) => {
                        document.write(`
                            <tr id="stgo-${index}" data-hora-plan="${hora}">
                                <td><strong>${hora}</strong></td>
                                <td><input type="text" id="input-bus-stgo-${index}" placeholder="Ej: 102" oninput="subirDatos('stgo', ${index})"></td>
                                <td>
                                    <input type="time" id="input-hora-stgo-${index}" class="input-hora" oninput="subirDatos('stgo', ${index})">
                                    <button class="btn-cancelar" onclick="alternarCancelado('stgo', ${index})">X</button>
                                </td>
                            </tr>
                        `);
                    });
                </script>
            </tbody>
        </table>
    </div>

    <!-- DESTINO CURICÓ -->
    <div class="destino-card">
        <div class="destino-header">Destino: Curicó</div>
        <table>
            <thead>
                <tr>
                    <th>Hora Plan</th>
                    <th>N° de Bus</th>
                    <th>Hora Real Salida</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    const horasCurico = ["7:20", "7:50", "8:20", "8:35", "8:50", "9:05", "9:20", "10:05", "10:35", "11:25", "11:35", "12:05", "12:35", "13:25", "14:35", "15:05", "15:25", "15:30", "16:05", "16:40", "17:05", "17:25", "17:40", "18:05", "18:35", "19:25", "19:35", "20:05", "20:30", "21:25"];
                    horasCurico.forEach((hora, index) => {
                        document.write(`
                            <tr id="cur-${index}" data-hora-plan="${hora}">
                                <td><strong>${hora}</strong></td>
                                <td><input type="text" id="input-bus-cur-${index}" placeholder="Ej: 88" oninput="subirDatos('cur', ${index})"></td>
                                <td>
                                    <input type="time" id="input-hora-cur-${index}" class="input-hora" oninput="subirDatos('cur', ${index})">
                                    <button class="btn-cancelar" onclick="alternarCancelado('cur', ${index})">X</button>
                                </td>
                            </tr>
                        `);
                    });
                </script>
            </tbody>
        </table>
    </div>

    <!-- DESTINO SANTA CRUZ -->
    <div class="destino-card">
        <div class="destino-header">Destino: Santa Cruz</div>
        <table>
            <thead>
                <tr>
                    <th>Hora Plan</th>
                    <th>N° de Bus</th>
                    <th>Hora Real Salida</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    const horasSCruz = ["8:05", "10:49", "11:49", "12:49", "13:19", "14:49", "15:49", "18:54", "19:49", "20:49", "21:19"];
                    horasSCruz.forEach((hora, index) => {
                        document.write(`
                            <tr id="scrz-${index}" data-hora-plan="${hora}">
                                <td><strong>${hora}</strong></td>
                                <td><input type="text" id="input-bus-scrz-${index}" placeholder="Ej: 45" oninput="subirDatos('scrz', ${index})"></td>
                                <td>
                                    <input type="time" id="input-hora-scrz-${index}" class="input-hora" oninput="subirDatos('scrz', ${index})">
                                    <button class="btn-cancelar" onclick="alternarCancelado('scrz', ${index})">X</button>
                                </td>
                            </tr>
                        `);
                    });
                </script>
            </tbody>
        </table>
    </div>

</div>

<script>
    const DESTINOS = ["stgo", "cur", "scrz"];
    const REALTIME_INTERVAL_MS = 1200;
    const NOMBRES_DIA = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
    const NOMBRES_MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

    let carpetaFecha = null;
    let referenciaTurnos = null;

    // Adaptador con la interfaz de Firebase Realtime Database solicitada.
    // Usa Netlify Database y evita exponer claves o credenciales en el navegador.
    const db = {
        ref: function (ruta) {
            let intervalo = null;
            let ultimaVersion = null;
            const partes = ruta.split("/").filter(Boolean);
            const fecha = partes[1] || "";
            const destino = partes[2];
            const slotIndex = partes[3];

            function obtenerDatos() {
                return fetch("/api/turnos?fecha=" + encodeURIComponent(fecha), { cache: "no-store" })
                    .then(function (respuesta) {
                        if (!respuesta.ok) throw new Error("No se pudieron cargar los turnos");
                        return respuesta.json();
                    });
            }

            return {
                on: function (evento, callback) {
                    if (evento !== "value") return;
                    const sincronizar = function () {
                        obtenerDatos().then(function (registros) {
                            const version = JSON.stringify(registros);
                            if (version === ultimaVersion) return;
                            ultimaVersion = version;
                            callback({ val: function () { return registros; } });
                        }).catch(function (error) {
                            console.log("Error de sincronización:", error);
                        });
                    };
                    sincronizar();
                    intervalo = setInterval(sincronizar, REALTIME_INTERVAL_MS);
                },
                off: function (evento) {
                    if (evento === "value" && intervalo) clearInterval(intervalo);
                    intervalo = null;
                },
                set: function (valor) {
                    if (!destino || slotIndex === undefined) {
                        return Promise.reject(new Error("La referencia debe apuntar a un turno"));
                    }
                    return fetch("/api/turnos", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(Object.assign({}, valor, {
                            fecha: fecha,
                            destino: destino,
                            slotIndex: Number(slotIndex),
                        })),
                    }).then(function (respuesta) {
                        if (!respuesta.ok) throw new Error("No se pudo guardar el turno");
                        return respuesta.json();
                    });
                },
            };
        },
    };

    function formatearFecha(fecha) {
        const dia = String(fecha.getDate()).padStart(2, '0');
        const mes = String(fecha.getMonth() + 1).padStart(2, '0');
        const anio = fecha.getFullYear();
        return { clave: dia + "-" + mes + "-" + anio, dia, mes, anio };
    }

    // Muestra la fecha del día en la interfaz y detecta el cambio de día automáticamente
    function actualizarFecha() {
        const ahora = new Date();
        const { clave, dia, anio } = formatearFecha(ahora);
        const textoFecha = NOMBRES_DIA[ahora.getDay()] + " " + dia + " de " + NOMBRES_MES[ahora.getMonth()] + " de " + anio;
        document.getElementById("fecha-actual").textContent = textoFecha;

        if (carpetaFecha !== clave) {
            const esCambioDeDia = carpetaFecha !== null;
            carpetaFecha = clave;
            if (esCambioDeDia) {
                resetTablero();
            }
            escucharTurnos();
        }
    }

    // Limpia toda la tabla al cambiar de día operativo
    function resetTablero() {
        document.querySelectorAll(".destino-card tbody tr").forEach((fila) => {
            fila.querySelectorAll("input").forEach((input) => { input.value = ""; });
            fila.classList.remove("despachado", "cancelado");
        });
    }

    // Envía el registro de un bus al backend
    function subirDatos(prefijo, id) {
        const fila = document.getElementById(prefijo + "-" + id);
        const busNum = document.getElementById("input-bus-" + prefijo + "-" + id).value;
        const horaReal = document.getElementById("input-hora-" + prefijo + "-" + id).value;
        const cancelado = fila.classList.contains("cancelado");

        db.ref("turnos/" + carpetaFecha + "/" + prefijo + "/" + id).set({
            horaPlan: fila.dataset.horaPlan,
            busNum: busNum,
            horaReal: horaReal,
            cancelado: cancelado,
        }).then(function () {
            verificarColorUI(prefijo, id, horaReal);
        }).catch(function (err) { console.log("Error al subir:", err); });
    }

    // Acción para el botón "X"
    function alternarCancelado(prefijo, id) {
        const fila = document.getElementById(prefijo + "-" + id);
        fila.classList.toggle("cancelado");
        if (fila.classList.contains("cancelado")) {
            fila.classList.remove("despachado");
        }
        subirDatos(prefijo, id);
    }

    // Marca la fila como "despachado"
    function verificarColorUI(prefijo, id, horaReal) {
        const fila = document.getElementById(prefijo + "-" + id);
        if (fila.classList.contains("cancelado")) return;
        if (horaReal && horaReal.trim() !== "") {
            fila.classList.add("despachado");
        } else {
            fila.classList.remove("despachado");
        }
    }

    function aplicarDatos(registros) {
        registros.forEach(function (registro) {
            if (!DESTINOS.includes(registro.destino)) return;
            const fila = document.getElementById(registro.destino + "-" + registro.slotIndex);
            if (!fila) return;

            const inputBus = document.getElementById("input-bus-" + registro.destino + "-" + registro.slotIndex);
            const inputHora = document.getElementById("input-hora-" + registro.destino + "-" + registro.slotIndex);

            if (document.activeElement !== inputBus) inputBus.value = registro.busNum || "";
            if (document.activeElement !== inputHora) inputHora.value = registro.horaReal || "";

            fila.classList.toggle("cancelado", !!registro.cancelado);
            if (registro.cancelado) {
                fila.classList.remove("despachado");
            } else if (registro.horaReal && registro.horaReal.trim() !== "") {
                fila.classList.add("despachado");
            } else {
                fila.classList.remove("despachado");
            }
        });
    }

    // Escucha la fecha activa con db.ref('turnos/' + fecha).on('value', ...).
    function escucharTurnos() {
        if (referenciaTurnos) referenciaTurnos.off("value");
        referenciaTurnos = db.ref("turnos/" + carpetaFecha);
        referenciaTurnos.on("value", function (snapshot) {
            aplicarDatos(snapshot.val() || []);
        });
    }

    // Función para descargar la vista completa en PDF
    function descargarPDF() {
        const elemento = document.body;
        const opciones = {
            margin:       8,
            filename:     'Registro_FlixBus_' + (carpetaFecha || 'hoy') + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opciones).from(elemento).save();
    }

    actualizarFecha();
    setInterval(actualizarFecha, 60000);
</script>

</body>
</html>
